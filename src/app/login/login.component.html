
<div #vantaBackground id="vanta-background"></div>
<div class="login-container">
    <div class="login-card">
        <div id="title">
           <p>Member Login</p>
        </div>
        

            <form (ngSubmit)="login()" id = "login-form">
                <div class="login-field">
                    <label for="username">Username</label>
                    <input type="text" pInputText id="username" autocomplete="username"
                            [(ngModel)]="model.username" name="username" required />
                </div>
    
                <div class="login-field">
                    <label for="password">Password</label>      
                    <p-password [feedback]="false" [toggleMask]="true" autocomplete="current-password"
                                [(ngModel)]="model.password" name="password" required/>
                </div>
                
                <div class="login-field">
                    <p-button label="Log In" class="login-button" [raised]="true" type="submit" />
                </div>
            </form>
        
    
    </div>
      
</div>
