
<nav class="
    flex items-center justify-between   /* Tailwind: flexbox, aliniere */
    px-6 py-2 h-16                     /* Tailwind: padding, înălţime */
    bg-surface dark:bg-surface-100    /* culori din PrimeNG vars */
    text-text                         /* culoare text din PrimeNG vars */
  " 
  [ngClass]="{'navbar-login': isLogin()}">
    <a aria-label="CVexplorer Logo" href="/dashboard" class="logo-container">
        <img [src]="logoPath" alt="Logo" width="10%"/>
    </a>
    <li>
        <p-button
            [icon]="'pi ' + (isDarkMode ? 'pi-sun' : 'pi-moon')"
            [variant]="'text'"
            [styleClass]="'topbar-item'"
            (onClick)="toggleTheme()"
        ></p-button>
    </li>
    @if(!isLoginRoute){
        <ul class="topbar-items">
            <li class="nav-item ">
                <p-button label="{{username()}}" [size]="isLargeScreen() ? 'large' : 'small'"  
                [variant]="'text'" [styleClass]="isDarkMode ? 'nav-username-dark' : 'nav-username-light'"  
                (onClick)="openAccountDetailsDialog()" />
            </li>
            <li *appHasRole="['HRLeader']">
                <p-button label="Manage Users" icon="pi pi-building" 
                    variant="outlined" [size]="isLargeScreen() ? 'large' : 'small'" 
                    (onClick)="openManageUsersDialog()"/>
            </li>
            <li *appHasRole="['HRLeader']">
                <p-button label="Enroll a User" icon="pi pi-user-plus" 
                    variant="outlined" [size]="isLargeScreen() ? 'large' : 'small'" 
                    (onClick)="openEnrollUserDialog()"/>
            </li>
            
            <li>
                <p-button label="Sign Out" [size]="isLargeScreen() ? 'large' : 'small'" severity="danger" icon="pi pi-sign-out"  [variant]="'outlined'"  (onClick)="signOut()"/>
            </li>
        </ul>
    }
    
    
    
</nav>


<p-dialog header="Enroll a New User" 
    [(visible)]="visibleEnrollUser" [modal]="true" 
    [style]="{ width: '25rem', border: 'None' }"
    (onHide)="closeEnrollUserDialog()"
>
  
    <app-nav-enroll-user (userEnrolled)="closeEnrollUserDialog()"></app-nav-enroll-user>
    
</p-dialog>



<p-dialog header="Account Details" 
[modal]="true"
[(visible)]="visibleDetails" 
[style]="{ width: '25rem' , border: 'None' }"
(onHide)="closeAccountDetailsDialog()"
>     
    <app-nav-user-details></app-nav-user-details>
</p-dialog>



<p-dialog header="Manage Users" 
    [(visible)]="visibleManageUsers" [modal]="true" 
    [style]="{ width: '100rem', height:'90rem' , border: 'None' }"
    (onHide)="closeManageUsersDialog()"
>
    <app-nav-manage-users></app-nav-manage-users>
   
</p-dialog>
