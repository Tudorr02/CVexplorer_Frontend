<div class="card">
    
    <p-table #dtCompanies 
        [value]="companies"  
        [scrollable]="true"
        scrollHeight="flex"
        [loading]="loadingCompanies"  
        [style]="{'width': '100%'}"
        [globalFilterFields]="['name']"
        editMode="row"
    >
        
        <ng-template #caption >

            <div class="flex justify-between items-center " >

                <p-iconfield iconPosition="left">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" [(ngModel)]="globalFilter" (input)="filterGlobal()" placeholder="Search companies..." />
                </p-iconfield>

                <div style="margin-inline: 2%;">
                    <!-- Add Button -->
                    <button *ngIf="!addingCompany"  pButton pRipple type="button" icon="pi pi-building" label="Add a company"
                    (click)="addCompanyInit()" W>
                    </button>

                    
                    <!-- Add Company Row -->
                    <div *ngIf="addingCompany" class="flex items-center gap-2" style="position: absolute;">
                        <p-icon-field icon="pi pi-building">
                            <input pInputText type="text" [(ngModel)]="newCompanyName" placeholder="Enter company name..." required />
                        </p-icon-field>
                        <button pButton pRipple type="button" icon="pi pi-check" (click)="confirmAddCompany()"  text rounded severity="success"></button>
                        <button pButton pRipple type="button" icon="pi pi-times" (click)="cancelAddCompany()"  text rounded severity="danger"></button>
                    </div>
                </div>

            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th style="width: 40%;">Company Name</th>
                <th style="width: 40%;">Employees</th>
                <th style="width: 10%;"></th>
                <th style="width: 10%;"></th>
            </tr>
        </ng-template>
        
        <ng-template #body let-company let-editing="editing" let-ri="rowIndex">
            <tr [pEditableRow]="company">

                <!-- Company Name (Editable) -->
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input pInputText type="text" [(ngModel)]="company.name" required />
                        </ng-template>
                        <ng-template pTemplate="output">
                            <span [ngClass]="{'grey-text': !company.name}">
                                {{ company.name || 'Not Available' }}
                            </span>
                        </ng-template>
                    </p-cellEditor>
                </td>

                <!-- Employees (Read-Only) -->
                <td>{{ company.employees }}</td>

                <!-- Actions -->
                <td>
                    <div class="flex items-center justify-center gap-2">
                        <button *ngIf="!editing" pButton pRipple type="button" pInitEditableRow
                            icon="pi pi-pencil" (click)="onRowEditInit(company,ri)" text rounded severity="secondary"></button>
                        <button *ngIf="editing" pButton pRipple type="button" pSaveEditableRow
                            icon="pi pi-check" (click)="onRowEditSave(company,ri)" text rounded severity="secondary"></button>
                        <button *ngIf="editing" pButton pRipple type="button" pCancelEditableRow
                            icon="pi pi-times" (click)="onRowEditCancel(company,ri)" text rounded severity="secondary"></button>
                    </div>
                </td>

                <!-- Delete Confirmation -->
                <td>
                    <!-- Default Mode: Show Trash Icon -->
                    <button *ngIf="!deletingCompanies[company.name]" pButton pRipple type="button" 
                        icon="pi pi-trash" (click)="onRowDeleteInit(company.name)" text rounded severity="danger">
                    </button>

                    <!-- Delete Mode: Show Confirm & Cancel -->
                    <ng-container *ngIf="deletingCompanies[company.name]">
                        <button pButton pRipple type="button" pSaveEditableRow 
                            icon="pi pi-check" (click)="onRowDeleteConfirm(company.name)" 
                            text rounded severity="secondary">
                        </button>
                        <button pButton pRipple type="button" pCancelEditableRow 
                            icon="pi pi-times" (click)="onRowDeleteCancel(company.name)" 
                            text rounded severity="secondary">
                        </button>
                    </ng-container>
                </td>
            </tr>
            
        </ng-template>
    
    </p-table>
    
    
</div>
