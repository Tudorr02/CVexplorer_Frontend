<div class=" h-full w-full ">
  <div #wrapper class="h-full">
    <p-table #dtCompanies 
        *ngIf="this.scrollHeight !=='0px'"
        [value]="companies"  
        [scrollable]="true"
        [scrollHeight]="scrollHeight"
        dataKey="id"  
         [rows]="16"
        [globalFilterFields]="['name']"
        editMode="row"
        styleClass="w-full h-full"
        [virtualScroll]="true" [virtualScrollItemSize]="80"
        
    >
        
        <ng-template #caption >

            <div class="flex gap-4" >

                <p-iconfield iconPosition="left">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" [(ngModel)]="globalFilter" (input)="filterGlobal()" placeholder="Search companies..." />
                </p-iconfield>

                <div class="flex justify-center ">
                    
                    <p-button *ngIf="!addingCompany" label="Add Company" variant="text" icon="pi pi-building" (onClick)="addCompanyInit()" />

                    <!-- Add Company Row -->
                    <div *ngIf="addingCompany" class="flex items-center justify-center gap-2">
                        <p-icon-field icon="pi pi-building">
                            <input pInputText type="text" [(ngModel)]="newCompanyName" placeholder="Enter company name..." required />
                        </p-icon-field>
                        <button pButton pRipple type="button" icon="pi pi-check" (click)="confirmAddCompany()"  text rounded severity="success"></button>
                        <button pButton pRipple type="button" icon="pi pi-times" (click)="cancelAddCompany()"  text rounded severity="danger"></button>
                    </div>
                </div>

            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th class="w-[40%]">Company Name</th>
                <th class="w-[40%]">Employees</th>
                <th class="w-[10%]"></th>
                <th class="w-[10%]"></th>
            </tr>
        </ng-template>
        
        <ng-template #body let-company let-editing="editing" let-ri="rowIndex">
            <tr class="h-20" [pEditableRow]="company">

                <!-- Company Name (Editable) -->
                <td>
                    <p-cellEditor>
                        <ng-template pTemplate="input">
                            <input pInputText type="text" [(ngModel)]="company.name" required />
                        </ng-template>
                        <ng-template pTemplate="output">
                            <span [ngClass]="{'grey-text': !company.name}">
                                {{ company.name || 'Not Available' }}
                            </span>
                        </ng-template>
                    </p-cellEditor>
                </td>

                <!-- Employees (Read-Only) -->
                <td>{{ company.employees }}</td>

                <!-- Actions -->
                <td>
                    <div class="flex items-center justify-center gap-2">
                        <button *ngIf="!editing" pButton pRipple type="button" pInitEditableRow
                            icon="pi pi-pencil" (click)="onRowEditInit(company)" text rounded severity="secondary"></button>
                        <button *ngIf="editing" pButton pRipple type="button" pSaveEditableRow
                            icon="pi pi-check" (click)="onRowEditSave(company)" text rounded severity="secondary"></button>
                        <button *ngIf="editing" pButton pRipple type="button" pCancelEditableRow
                            icon="pi pi-times" (click)="onRowEditCancel(company)" text rounded severity="secondary"></button>
                    </div>
                </td>

                <!-- Delete Confirmation -->
                <td>
                    <div class="flex items-center justify-center gap-2">
                    <!-- Default Mode: Show Trash Icon -->
                        <button *ngIf="!deletingCompanies[company.id]" pButton pRipple type="button" 
                            icon="pi pi-trash" (click)="onRowDeleteInit(company.id)" text rounded severity="danger">
                        </button>

                        <!-- Delete Mode: Show Confirm & Cancel -->
                        <ng-container *ngIf="deletingCompanies[company.id]">
                            <button pButton pRipple type="button" pSaveEditableRow 
                                icon="pi pi-check" (click)="onRowDeleteConfirm(company.id,company.name)" 
                                text rounded severity="secondary">
                            </button>
                            <button pButton pRipple type="button" pCancelEditableRow 
                                icon="pi pi-times" (click)="onRowDeleteCancel(company.id)" 
                                text rounded severity="secondary">
                            </button>
                        </ng-container>
                    </div>
                </td>
            </tr>
            
        </ng-template>

    </p-table> 
</div>
</div>
