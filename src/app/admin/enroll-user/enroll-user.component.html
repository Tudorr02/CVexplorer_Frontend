
<div class="w-full h-full flex flex-col gap-1 ">
    <div class="w-full flex h-4/5">

        <div class="w-1/2 px-[8vw] py-[4vh]">
            <div class="border-custom w-full h-full flex flex-col items-center ">
                <h2 class=" h-1/5 text-2xl font-semibold justify-center items-center flex w-full">Mandatory Fields</h2>
                <div class=" h-4/5  flex flex-col gap-4 justify-center  p-6">
                        <div class="flex items-center justify-between  gap-4">
                            <label for="username" class="font-semibold">Username</label>
                            <input pInputText id="username"  [(ngModel)]="userEnrollment.username"/>
                        </div>

                        <div class="flex items-center justify-between  gap-4">
                            <label for="password" class="font-semibold">Password</label>
                            <input pInputText id="password" [(ngModel)]="userEnrollment.password"/>
                        </div>

                        <div class="flex flex-col   gap-1">
                            <div class="flex items-center justify-between  gap-4">
                                <label class="font-semibold">Role</label>
                                <p-selectButton
                                    [options]="roles | slice:0:2"
                                    [(ngModel)]="userEnrollment.userRole"
                                    optionLabel="name"
                                    optionValue="key"
                                    aria-labelledby="basic1"
                                    [ngStyle]="{ 'background-color': getRoleSeverity(userEnrollment.userRole) }"
                                ></p-selectButton>

                            </div>
                            <div class="flex items-center justify-between  gap-4">
                                <label></label>
                                    <p-selectButton
                                        [options]="roles | slice:2:4"
                                        [(ngModel)]="userEnrollment.userRole"
                                        optionLabel="name"
                                        optionValue="key"
                                        aria-labelledby="basic2"
                                        [ngStyle]="{ 'background-color': getRoleSeverity(userEnrollment.userRole) }"
                                    ></p-selectButton>
                            </div>
                        </div>
                </div>
            </div>
        </div>

        <div class="w-1/2 px-[8vw] py-[4vh]">
            <div class="border-custom w-full  h-full flex flex-col items-center ">
                <h2 class=" h-1/5 text-2xl font-semibold justify-center items-center flex w-full">Optional Fields</h2>
                <div class=" h-4/5  flex flex-col gap-4 justify-center  p-6">
                        <div class="flex items-center justify-between  gap-4">
                            <label for="firstName" class="font-semibold">First Name</label>
                            <input pInputText id="firstName"  [(ngModel)]="userEnrollment.firstName"/>
                        </div>

                        <div class="flex items-center justify-between  gap-4">
                            <label for="lastName" class="font-semibold">Last Name</label>
                            <input pInputText id="lastName" [(ngModel)]="userEnrollment.lastName"/>
                        </div>

                        <div class="flex items-center justify-between  gap-4">
                            <label for="email" class="font-semibold">Email</label>
                            <input pInputText id="email" [(ngModel)]="userEnrollment.email"/>
                        </div>

                        <div class="flex items-center justify-between  gap-4">
                            <label for="companyName" class="font-semibold">Company</label>
                            <p-select id="companyName" 
                              [(ngModel)]="userEnrollment.companyName"
                              [options]="companies" 
                              [filter]="true"
                              placeholder="Select a Company"
                              (click)="fetchCompanies()"
                              [loading]="loadingCompanies"
                              [showClear]="true"    
                            >
                    </p-select>

                        </div>
                        
                </div>
            </div>
        </div>

    </div>
    <div class="w-full h-1/5 flex items-center justify-center">
        <p-button label="Enroll User" icon="pi pi-user-plus" variant="text" (onClick)="enrollUser()" />
    </div>
</div>
