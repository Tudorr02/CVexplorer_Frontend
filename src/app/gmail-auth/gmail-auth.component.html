
<p-button [disabled]="sessionActive" label="Connect with Google" (click)="connect()"></p-button>

<div *ngIf="labels.length" class="mt-4">
  <p-select [(ngModel)]="selectedLabel"
          class="p-inputtext p-component"
          [options]="labels"
          optionLabel="name"
          optionValue="id"
          placeholder="Select a Folder"
          />
    
  <p-button
  pButton
  type="button"
  label="Start Watch"
  icon="pi pi-play"
  (click)="watch()"
  [disabled]="!selectedLabel"
/>
</div>
