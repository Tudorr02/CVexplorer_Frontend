
<p-button [disabled]="labels.length > 0 " label="Connect with Google" (click)="connect()"></p-button>

<div *ngIf="labels.length" class="mt-4">
  <p-select [(ngModel)]="selectedLabel"
          class="p-inputtext p-component"
          [options]="labels"
          optionLabel="name"
          optionValue="id"
          placeholder="Select a Folder"
          />
    

</div>
