
<p-button [disabled]="sessionActive" label="Connect with Google" (onClick)="connect()"/>

<div *ngIf="labels.length" class="mt-4">
   <p-multiSelect
    [(ngModel)]="selectedLabels"
    [options]="labels"
    optionLabel="name"
    optionValue="id"
    placeholder="Select Folders"
    display="chip"
    class="p-inputtext p-component"
  />
    
  <p-button
  
  label="Start Watch"
  icon="pi pi-play"
  (click)="watch()"
  [disabled]="!selectedLabels.length"/>
</div>
