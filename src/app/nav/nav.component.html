
<nav class="navbar" [ngClass]="{'navbar-login': isLogin()}">
    <a aria-label="CVexplorer Logo" href="/dashboard" class="logo-container">
        <img [src]="logoPath" alt="Logo" width="10%"/>
    </a>

    @if(!isLoginRoute){
        <ul class="topbar-items">
            <li class="nav-item ">
                <p-button label="{{username}}" variant="text" styleClass="nav-username" (onClick)="showDetails()" />
            </li>
            <li>
                <p-button label="{{ buttonText }}" [size]="'small'"  icon="{{iconClass}}" class="topbar-item" [style]="{ 'width':'7.8rem'}"    [outlined]="true" (click)="toggleTheme()"/>
            </li>
            <li>
                <p-button label="Sign Out" [size]="'small'" severity="danger" icon="pi pi-sign-out"  [outlined]="true" (onClick)="signOut()"/>
            </li>
        </ul>
    }
    
    
    
</nav>


<p-dialog header="Edit Account Details" [modal]="true" [(visible)]="visibleDetails" [style]="{ width: '25rem' }">
    <span class="p-text-secondary block mb-4">Update your information.</span>

    <div class="content">
        <div class="field">
            <label for="username" class="font-semibold w-24">Username</label>
            <input pInputText id="username"  autocomplete="off" />
        </div>
        <div class="field">
            <label for="email" class="font-semibold w-24">Email</label>
            <input pInputText id="email" autocomplete="off" />
        </div>
    </div>
    
    <div class="flex justify-end gap-2 w-full">
        <p-button class="ml-auto" label="Cancel" severity="secondary" (click)="visibleDetails = false" />
        <p-button label="Save" (click)="visibleDetails = false" />
    </div>
</p-dialog>
