

<div class="w-full h-full shadow-7 flex border-custom  overflow-hidden ">
  
  <div class="w-2/6 h-full flex relative justify-center items-center">
    <img src='card-image.svg' alt="" width="100%" height="100%" class="object-cover" >
    
    <span class="absolute font-medium text-2xl text-white flex flex-col gap-2 items-center">
    {{ round.name }}
     <i class="pi pi-trophy" style="font-size: 1.5rem" ></i>
    </span>
  </div>

  <div class="w-3/6 h-full flex flex-col justify-center items-start  px-2">
    <p class="font-medium">Created: {{ round.createdAt | date:'dd/MM/yyyy' }}</p>
    <p class="font-medium">Candidates: 15</p>
    <p class="font-medium">Selected: 2</p>

  </div>
  <div class="w-1/6 h-full flex items-center justify-center">
    <p-button
      icon="pi pi-arrow-circle-right"
      size="large"
      [rounded]="true"
      [text]="true"
      (onClick)="openRound(round.publicId)"
    ></p-button>

</div>
