
<div class=" h-[5rem] rounded-3xl flex items-center px-2 gap-2 bg-[var(--p-content-background)]" cdkDrag>
    <div  class="flex justify-center">
        <p-avatar icon="pi pi-user" size="large" shape="circle" />
    </div>
    <div class="w-3/6 flex justify-start">
        <strong  >{{ entry.candidateName }}</strong>
    </div>
    <div class="flex flex-col w-1/6 justify-center items-center">
        <p class="text-sm font-medium">Points</p>
        <span > {{ entry.score }}</span>
    </div>  
    <div class="flex flex-col w-1/6 justify-center items-center">
        
        <p-button label="See Evaluation" size="small" rounded="true" text="true" (onClick)="getEvaluationResult(entry.id)" />
    </div>
</div>

<p-dialog 
    header="Evaluation Result"
    [modal]="true" 
    [(visible)]="viewEvaluation"
    [modal]='true'
    styleClass=" shadow-9 w-dialog-lg h-dialog-lg border-none"
    (onHide)="onDialogHide()" 

   >
  

    <div class="flex w-full h-full relative">
        <div class="flex w-1/2 h-full" >
            <iframe 
            *ngIf="pdfUrl"
            [src]="pdfUrl"
            class="w-full h-full"
            style="border:none;"
            ></iframe>
        </div>
        <div class="flex w-1/2 h-full">
            <p-accordion styleClass="w-full" *ngIf="evaluationTabs.length">
                @for (tab of evaluationTabs; track tab.title) {
                    <p-accordion-panel  [value]="tab.value">
                        <p-accordion-header class="font-medium">
                            <div class="flex  w-full items-center">
                                <p class="w-1/3  text-white">{{ tab.title }}</p>
                                <p class="flex justify-start items-start">Similarity: {{tab.score}} %</p> 
                            </div>
                        </p-accordion-header>

                        <p-accordion-content class="flex flex-col w-full">
                            <!-- dacă body e array afișează fiecare element pe rând -->
                            <!-- <ng-container *ngIf="Array.isArray(tab.body); else scalar">
                            <ul class="list-disc list-inside ml-3">
                                @for (item of tab.body; track $index) {
                                <li>{{ item }}</li>
                                }
                            </ul>
                            </ng-container> -->

                            <div class="flex flex-col w-full gap-2">
                                <div class="flex w-full flex-wrap gap-2 items-center">
                                <p class="w-[6rem] font-medium">Candidate</p>   
                                <p class="">{{ tab.body }} </p>
                                </div>

                                <div class="flex w-full flex-wrap gap-2 items-center">
                                <p class="w-[6rem]  font-medium">Position</p>   
                                <p class="">{{ tab.positionBody }}</p>
                                </div>
                            </div>
                            
                            
                        </p-accordion-content>
                    </p-accordion-panel>
                }
            </p-accordion>
            
        </div>
        
    </div>
