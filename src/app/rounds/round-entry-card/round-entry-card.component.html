<div class="card align-items-center" cdkDrag>
    <p-avatar icon="pi pi-user" class="mr-2 w-1/4" size="large" shape="circle" />
    <strong class="w-1/4 flex justify-center" >{{ entry.candidateName }}</strong>
    <span class="w-1/4 flex justify-center"> {{ entry.score }} pts</span>
    <p-button class="w-1/4" label="See Evaluation" size="small" variant="text" (onClick)="getEvaluationResult(entry.id)" />
    
</div>

<p-dialog 
    [modal]="true" 
    [(visible)]="viewEvaluation"
    [modal]='true'
    [style]="{'width': '100%', 'height': '100%'}"
    (onHide)="onDialogHide()" 

   >
    <ng-template pTemplate="header">
        <div class="flex justify-between items-center">
            <h4>Evaluation Result</h4>
        </div>
    </ng-template>

    <div class="flex w-full h-full relative">
        <div class="flex w-1/2 h-full" >
            <iframe 
            *ngIf="pdfUrl"
            [src]="pdfUrl"
            class="w-full h-full"
            style="border:none;"
            ></iframe>
        </div>
        <div class="flex w-1/2 h-full justify-center">
            <div class="flex flex-col items-center gap-2" >
        
                <p class = "text-xl">CV Results</p>
                  
                <div class="flex gap-5">
                    <label class="mt-2" >Required Skills</label>
                    <textarea pTextarea rows="3" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.requiredSkills?.scraped" ></textarea>
                    <p-inputnumber id="requiredSkillsScore" [disabled]="!editMode" [inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.requiredSkills?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" >Nice To Have </label>
                    <textarea pTextarea rows="3" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.niceToHave?.scraped" ></textarea>
                    <p-inputnumber id="requiredSkillsScore" [disabled]="!editMode" [inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.niceToHave?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" for="requiredSkills">Languages </label>
                    <textarea pTextarea rows="1" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.languages?.value" ></textarea>
                    <p-inputnumber id="requiredSkillsScore"  [disabled]="!editMode" [inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.languages?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" for="requiredSkills">Certification </label>
                    <textarea pTextarea rows="1" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.certifications?.scraped" ></textarea>
                    <p-inputnumber id="requiredSkillsScore" [disabled]="!editMode" [inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.certifications?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" for="requiredSkills">Responsibilities </label>
                    <textarea pTextarea rows="3" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.responsibilities?.scraped" ></textarea>
                    <p-inputnumber id="requiredSkillsScore"  [disabled]="!editMode" [inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.responsibilities?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" for="requiredSkills">Experience Months </label>
                    <textarea pTextarea rows="1" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.minimumExperienceMonths?.value" ></textarea>
                    <p-inputnumber id="requiredSkillsScore"  [disabled]="!editMode"[inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.minimumExperienceMonths?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" for="requiredSkills">Level </label>
                    <textarea pTextarea rows="1" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.level?.value" ></textarea>
                    <p-inputnumber id="requiredSkillsScore" [disabled]="!editMode"  [inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.level?.score"/>
                </div>
                <div class="flex gap-5">
                    <label class="mt-2" for="requiredSkills">Education Level </label>
                    <textarea pTextarea rows="1" cols="50" [readOnly]="!editMode" [ngModel]="eval?.evaluation?.minimumEducationLevel?.value" ></textarea>
                    <p-inputnumber id="requiredSkillsScore"  [disabled]="!editMode"[inputStyle]="{ width: '5rem' , height: '3rem' }" [ngModel]="eval?.evaluation?.minimumEducationLevel?.score"/>
                </div>
            </div>
        </div>
        <div class="absolute bottom-4 right-4">

            <!-- View-only: single Edit button -->
            <p-button
                *ngIf="!editMode"
                label="Edit Evaluation"
                (click)="editEvaluation()">
            </p-button>
          
            <!-- Edit mode: Cancel + Update -->
            <div *ngIf="editMode" class="flex gap-2">
              <p-button
                  label="Cancel"
                  severity="secondary"
                  (click)="cancelEdit()">
              </p-button>
          
              <p-button
                  label="Update"
                  (click)="updateEvaluation(eval.cvPublicId, eval.evaluation)">
              </p-button>
            </div>
          
          </div>
        </div>

</p-dialog>
