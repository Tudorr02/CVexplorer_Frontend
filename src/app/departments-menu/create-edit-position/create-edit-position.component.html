<div class="w-full h-full">
  <p-stepper [value]="1" [linear]="true" class="flex flex-col w-full h-full justify-center items-center "  >
    <p-step-list class="w-full px-8" >
        <p-step [value]="1">General Details</p-step>
        <p-step [value]="2">Candidate Profile</p-step>
        <p-step [value]="3">Evaluation Weights</p-step>
     

    </p-step-list>

    <form [formGroup]="positionForm" (ngSubmit)="onSubmit()" >
      <p-step-panels>
         
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback"  >
            <div class="flex  w-[50vw]  h-[50vh] border-custom py-4 ">

              <div class="flex flex-col border-r-2 border-[var(--p-form-field-border-color)] px-4  gap-4 w-1/2 ">
                
                <div class="flex flex-col gap-2 ">

                  <label for="positionName" class="font-medium">Position Name</label>
                  <input
                    id="positionName"
                    class="w-2/3"
                    type="text"
                    pInputText
                    formControlName="name"
                    pInputText
                    placeholder="e.g. Frontend Developer"

                  />

                  <small  *ngIf="positionForm.get('name')?.touched && positionForm.get('name')?.hasError('required')">
                    Position name is required.
                  </small>

                </div>
                    

                
                <div class="flex flex-col gap-2">

                  <label class="font-medium">Level</label>
                  <p-selectButton
                    formControlName="level"
                    [options]="positionLevels"
                    optionLabel="label"
                    optionValue="value"
                  />
                </div>

              </div>
                
              
              <div class="gap-4 w-1/2 px-4">
                <div class="flex flex-col gap-2 h-full   ">
                  <label class="font-medium">Responsibilities</label>
                  
                  <div class="flex items-center gap-2">
                    <p-button 
                      icon="pi pi-plus" 
                      label="Add" 
                      size="small" 
                      (onClick)="addResponsibility()"
                      [text]="true"
                    />
                    <p-button 
                      icon="pi pi-minus" 
                      label="Remove" 
                      size="small" 
                      (onClick)="removeResponsibility()"
                      [text]="true"
                    />
                  </div>
                  
                  <div formArrayName="responsibilities" class=" flex flex-col h-full overflow-auto flex-1 gap-2">
                    <div *ngFor="let control of responsibilities.controls; let i = index" >
                      <input
                        type="text"
                        pInputText
                        [formControlName]="i"
                        placeholder="e.g. Build features, Attend meetings"
                        class="w-full"
                      />
                    </div>
                  </div>
                  
                </div>
              </div>
                
            </div>

            <div class="flex justify-end pt-4">
              <p-button
                variant="outlined"
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                (onClick)="goToStep(2, activateCallback)"
              />
            </div>

          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
           
            <div class="flex  w-[50vw]  h-[50vh] border-custom py-4 ">
            
              <div class="flex flex-col border-r-2 border-[var(--p-form-field-border-color)] px-4  gap-4 w-1/2 ">
                <div class="flex flex-col gap-2 ">
                  <label class="font-medium">Hard Skills (comma-separated)</label>
                  <textarea  rows="3" class="resize-none" [autoResize]="false" 
                  [placeholder]="'e.g. TypeScript, Angular, Git'" pTextarea formControlName="requiredSkills"></textarea>
                </div>
                <div class="flex flex-col gap-2 ">
                  <label class="font-medium">Minimum Experience (months)</label>
                  <p-inputNumber
                    formControlName="minimumExperienceMonths"
                    [min]="0"
                    [showButtons]="true"
                    buttonLayout="horizontal"
                    [ngClass]="{
                      'p-invalid': positionForm.get('minimumExperienceMonths')?.invalid && positionForm.get('minimumExperienceMonths')?.touched
                    }"
                    class=" w-1/3"
                    inputStyleClass="w-1/3"
                    >
                    <ng-template #incrementbuttonicon>
                      <span class="pi pi-plus"></span>
                    </ng-template>
                    <ng-template #decrementbuttonicon>
                      <span class="pi pi-minus"></span>
                    </ng-template>
                  </p-inputNumber>
                </div>
        
                <div class="flex flex-col gap-2 ">
                  <label class="font-medium">Minimum Education Level</label>
                  <p-selectButton
                    formControlName="minimumEducationLevel"
                    [options]="educationLevels"
                    optionLabel="label"
                    optionValue="value"
                  />
                </div>
              </div>
              
              <div class="gap-4 w-1/2 px-4 flex flex-col">
                  <div class="flex flex-col gap-2 ">
                    <label class="font-medium">Soft Skills (comma-separated)</label>
                    <textarea
                      rows="3"
                      placeholder="e.g. Unit Testing, Docker, TailwindCSS"
                      pTextarea
                      [autoResize]="false"
                      class="resize-none"
                      formControlName="niceToHave"
                    ></textarea>
                  </div>
          
                  
                  <div class="flex flex-col gap-2">
                    <label class="font-medium">Known Languages</label>
                    <p-multiSelect
                      class="w-2/3"
                      [options]="languages"
                      optionLabel="label"
                      optionValue="value"
                      display="chip"
                      [showToggleAll]="false"
                      formControlName="languages"
                      placeholder="Select languages"
                    ></p-multiSelect>
                  </div>
          
               
                  <div class="flex flex-col gap-2">
                    <label class="font-medium">Certifications (comma-separated)</label>
                    <textarea
                      rows="3"
                      placeholder="e.g. AWS Certified Developer, Scrum Master"
                      pTextarea
                      [autoResize]="false"
                      class="resize-none"
                      formControlName="certifications"
                    ></textarea>
                  </div>
              </div>
            </div>

            <div class="flex justify-between gap-4 pt-4">
              <p-button
                variant="outlined"
                label="Back"
                icon="pi pi-arrow-left"
                (onClick)="activateCallback(1)"
                severity="secondary"
              />
              <p-button
                variant="outlined"
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                (onClick)="goToStep(3, activateCallback)"
              />
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="3">
            <ng-template #content let-activateCallback="activateCallback">
              <div formGroupName="weights" class="flex  w-[50vw]  h-[50vh] border-custom py-4 ">
                <div  class="flex flex-col border-r-2 border-[var(--p-form-field-border-color)] px-4  gap-4 w-1/2 ">
                
                  <ng-container *ngFor="let field of weightFields | slice: 0:4" >
                      <label class="font-medium">
                        {{ field.label }}: {{ this.positionForm.get('weights.' + field.key)?.value }}%
                      </label>
                      <p-slider
                        [formControlName]="field.key"
                        [min]="0" [max]="100" [step]="1"
                        class="w-full"
                      ></p-slider>
                  </ng-container>
                  
                    <!-- Knob showing the total sum -->
                  <div class="flex flex-col justify-center items-center ">
                    <p-knob
                      formControlName="totalWeight"
                      [min]="0"
                      [max]="positionForm.get('weights.totalWeight')!.value > 100
                            ? positionForm.get('weights.totalWeight')!.value
                            : 100"
                      [step]="1"
                      [valueColor]="sumWeights > 100 ? 'red' : 'var(--p-primary-color)'"
                      valueTemplate="{value}%"
                      [readonly]="true"
                    ></p-knob>
                    <small *ngIf="positionForm.get('weights')?.hasError('sumNotOne') && positionForm.get('weights')?.touched" >
                    All weights must sum to 100%
                    </small>

                  </div>
                </div>
                
                <div class="flex flex-col gap-4 w-1/2 px-4">

                  <ng-container *ngFor="let field of weightFields | slice: 4:8" >
                      <label class="font-medium">
                        {{ field.label }}: {{ this.positionForm.get('weights.' + field.key)?.value }}%
                      </label>
                      <p-slider
                        [formControlName]="field.key"
                        [min]="0" [max]="100" [step]="1"
                        class="w-full"
                      ></p-slider>
                  </ng-container>
                  
                </div>
                
                
              </div>
          
              <!-- Navigation Buttons -->
              <div class="flex justify-between gap-4 pt-4">
                <p-button
                  variant="outlined"
                  label="Back"
                  icon="pi pi-arrow-left"
                  (onClick)="activateCallback(2)"
                  severity="secondary"
                />
                <p-button
                variant="outlined"
                label="{{ isEditMode ? 'Update' : 'Create' }}"
                icon="pi pi-check"
                iconPos="right"
                (onClick)="onSubmit()"
                ></p-button>
            
              </div>
                
            </ng-template>
        </p-step-panel>

        
      </p-step-panels>
      
    </form>
      
  </p-stepper>
</div>
