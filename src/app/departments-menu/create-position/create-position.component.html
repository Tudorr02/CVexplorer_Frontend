<div class="card flex justify-center items-center w-full h-full">
  <p-stepper [value]="1" class="w-[100%] h-[100%] flex flex-col mt-4 items-center"  [linear]="true">
    <p-step-list  class="w-[60%] h-[10%]">
        <p-step [value]="1">General Details</p-step>
        <p-step [value]="2">Requirements</p-step>
        <p-step [value]="3">Nice To Have</p-step>
        <p-step [value]="4">Set Weights</p-step>

    </p-step-list>

    <form [formGroup]="positionForm" class=" flex flex-col justify-center items-center">
      <p-step-panels class="flex flex-col  items-center">
          <p-step-panel [value]="1">
              <ng-template #content let-activateCallback="activateCallback" >
                
                <div class="flex flex-row h-[50vh] w-[50vw] py-4  divide-x divide-surface-700 border-2 border-dashed border-surface-700 rounded-xl">

                  <!-- Bloc 1: Name + Level -->
                  <div class="flex flex-col  gap-4 w-1/2  px-4">
                    <!-- Position Name -->
                    <div class="field">
                      <label for="positionName" class="font-medium">Position Name</label>
                      <input
                        id="positionName"
                        class="w-8"
                        type="text"
                        pInputText
                        formControlName="name"
                        pInputText
                        placeholder="e.g. Frontend Developer"
                        [ngClass]="{ 'p-invalid': positionForm.get('name')?.invalid && positionForm.get('name')?.touched }"

                      />

                      <small class="p-error" *ngIf="positionForm.get('name')?.touched && positionForm.get('name')?.hasError('required')">
                        Position name is required.
                      </small>
                    </div>
                    

                    <!-- Level (select button) -->
                    <div class="field">
                      <label class="font-medium">Level</label>
                      <p-selectButton
                        
                        formControlName="level"
                        [options]="positionLevels"
                        optionLabel="label"
                        optionValue="value"
                      />
                    </div>
                  </div>
                
                  <!-- Bloc 2: Responsibilities -->
                  <div class="flex flex-col gap-4 w-1/2   px-4">
                    <div class="field">
                      <label class="font-medium">Responsibilities</label>
                      
                      <div class="flex items-center gap-2">
                        <p-button 
                          icon="pi pi-plus" 
                          label="Add" 
                          size="small" 
                          (onClick)="addResponsibility()"
                          [text]="true"
                        />
                        <p-button 
                          icon="pi pi-minus" 
                          label="Remove" 
                          size="small" 
                          (onClick)="removeResponsibility()"
                          [text]="true"
                        />
                      </div>
                      
                      <div formArrayName="responsibilities" class="max-h-[32vh] overflow-y-auto">
                        <div *ngFor="let control of responsibilities.controls; let i = index" class="field">
                          <input
                            type="text"
                            pInputText
                            [formControlName]="i"
                            placeholder="e.g. Build features, Attend meetings"
                          />
                        </div>
                      </div>
                      
                    </div>
                  </div>
                
                </div>
                <div class="flex justify-end pt-4">
                  <p-button
                    label="Next"
                    icon="pi pi-arrow-right"
                    iconPos="right"
                    (onClick)="goToStep(2, activateCallback)"
                  />
                </div>
              </ng-template>
          </p-step-panel>

          <p-step-panel [value]="2">
            <ng-template #content let-activateCallback="activateCallback">
              <div class="flex justify-center items-center h-[50vh] w-[50vw] py-4  border-2 border-dashed border-surface-700 rounded-xl">
                
                <div class="flex flex-col gap-4 px-4 ">
                  <div class="field">
                    <label class="font-medium">Required Skills (comma-separated)</label>
                    <!-- <input
                      type="text"
                      pInputText
                      class="w-[20vw] h-[10vh]"
                      style="border: 1px solid green;"
                      (blur)="onListInput('requiredSkills', $event)"
                      placeholder="e.g. TypeScript, Angular, Git"
                    /> -->
                    <textarea  rows="3" class="resize-none" [autoResize]="false" 
                    [placeholder]="'e.g. TypeScript, Angular, Git'" pTextarea formControlName="requiredSkills"></textarea>
                  </div>
                  <div class="field">
                    <label class="font-medium">Minimum Experience (months)</label>
                    <p-inputNumber
                      formControlName="minimumExperienceMonths"
                      [min]="0"
                      [showButtons]="true"
                      [buttonLayout]="'horizontal'"
                      [ngClass]="{
                        'p-invalid': positionForm.get('minimumExperienceMonths')?.invalid && positionForm.get('minimumExperienceMonths')?.touched
                      }"
                    />
                  </div>
          
                  <div class="field">
                    <label class="font-medium">Minimum Education Level</label>
                    <p-selectButton
                      formControlName="minimumEducationLevel"
                      [options]="educationLevels"
                      optionLabel="label"
                      optionValue="value"
                    />
                  </div>
                </div>
          
              </div>
          
              <div class="flex justify-end gap-4 pt-4">
                <p-button
                  label="Back"
                  icon="pi pi-arrow-left"
                  (onClick)="activateCallback(1)"
                  severity="secondary"
                />
                <p-button
                  label="Next"
                  icon="pi pi-arrow-right"
                  iconPos="right"
                  (onClick)="goToStep(3, activateCallback)"
                />
              </div>
            </ng-template>
          </p-step-panel>
          

          <p-step-panel [value]="3">
            <ng-template #content let-activateCallback="activateCallback">
              <div class="flex justify-center items-center h-[50vh] w-[50vw] py-4 border-2 border-dashed border-surface-700 rounded-xl">
                <div class="flex flex-col gap-4 px-4">
                  
                  <!-- Nice To Have (textarea) -->
                  <div class="field">
                    <label class="font-medium">Nice to Have Skills (comma-separated)</label>
                    <textarea
                      rows="3"
                      placeholder="e.g. Unit Testing, Docker, TailwindCSS"
                      pTextarea
                      [autoResize]="false"
                      class="resize-none"
                      formControlName="niceToHave"
                    ></textarea>
                  </div>
          
                  <!-- Languages (multi-select) -->
                  <div class="field">
                    <label class="font-medium">Languages</label>
                    <p-multiSelect
                      [options]="languages"
                      optionLabel="label"
                      optionValue="value"
                      display="chip"
                      [showToggleAll]="false"
                      formControlName="languages"
                      placeholder="Select languages"
                    ></p-multiSelect>
                  </div>
          
                  <!-- Certifications (multi-select) -->
                  <div class="field">
                    <label class="font-medium">Certifications (comma-separated)</label>
                    <textarea
                      rows="3"
                      placeholder="e.g. AWS Certified Developer, Scrum Master"
                      pTextarea
                      [autoResize]="false"
                      class="resize-none"
                      formControlName="certifications"
                    ></textarea>
                  </div>
          
                </div>
              </div>
          
              <!-- Navigation Buttons -->
              <div class="flex justify-end gap-4 pt-4">
                <p-button
                  label="Back"
                  icon="pi pi-arrow-left"
                  (onClick)="activateCallback(2)"
                  severity="secondary"
                />
                <p-button
                label="Next"
                icon="pi pi-arrow-right"
                iconPos="right"
                (onClick)="goToStep(4, activateCallback)"
              />
            
              </div>
                
            </ng-template>
        </p-step-panel>

        <p-step-panel [value]="4">
          <ng-template #content let-activateCallback="activateCallback">
            
            <div formGroupName="weights" class="flex gap-8 w-[50vw] p-4 border-2 border-dashed border-surface-700 rounded-xl">

              <!-- Left column: first 4 fields -->
              <div class="flex-1 space-y-4">
                <ng-container *ngFor="let field of weightFields | slice:0:4" class="gap-2 ">
                  <label class="block font-medium mb-2">
                    {{ field.label }}: {{ positionForm.get('weights.' + field.key)?.value }}%
                  </label>
                  <p-slider
                    [formControlName]="field.key"
                    [min]="0" [max]="100" [step]="1"
                    class="w-full"
                  ></p-slider>
                </ng-container>
              </div>
            
              <!-- Right column: last 4 fields -->
              <div class="flex-1 space-y-4">
                <ng-container *ngFor="let field of weightFields | slice:4:8" class="gap-2 ">
                  <label class="block font-medium mb-2">
                    {{ field.label }}: {{ positionForm.get('weights.' + field.key)?.value }}%
                  </label>
                  <p-slider
                    [formControlName]="field.key"
                    [min]="0" [max]="100" [step]="1"
                    class="w-full"
                  ></p-slider>
                </ng-container>
              </div>
            
            </div>
            
            <small *ngIf="positionForm.get('weights')?.hasError('sumNotOneHundred')" class="p-error">
              All weights must sum to 100
            </small>
            
            <div class="flex justify-end gap-4 pt-4">
              <p-button
                label="Back"
                icon="pi pi-arrow-left"
                (onClick)="activateCallback(3)"
                severity="secondary"
              ></p-button>
              <p-button
                label="Submit"
                icon="pi pi-check"
                iconPos="right"
                (onClick)="onSubmit()"
              ></p-button>
            </div>
          </ng-template>
        </p-step-panel>

      </p-step-panels>
      
    </form>
      
  </p-stepper>
</div>
