<div class="h-full w-full flex flex-col">
  <div class=" h-4/5 flex flex-col gap-3 px-4 justify-center">
    <div class="flex  items-center  justify-between ">
      <label for="departmentName" class="font-medium w-1/3 flex">Department Name</label>
      <input pInputText id="departmentName"  [(ngModel)]="this.department.name" autocomplete="off" class="w-2/3"  />
    </div>
    <div class="flex  items-center justify-between  ">
      <label for="departmentAcess" class="font-medium w-1/3">Grant Access</label>
      <p-multiselect [options]="this.department.departmentAccesses" 
      [(ngModel)]="this.selectedUsers" 
      optionLabel="userName"
      display="chip"
      optionValue="userId" placeholder="Select Users" appendTo="body"  styleClass="w-2/3" />
    </div>
  </div>
  <div class="h-1/5 flex justify-end items-center gap-3">
      @if(loading){
          <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '3vh', height: '3vh' }" />
      }
      <p-button label="Cancel" (click)="departmentAdded.emit()" severity="secondary" ></p-button>
      <p-button label="Add" (click)="addDepartment(this.department)" ></p-button>
  </div>
</div>
