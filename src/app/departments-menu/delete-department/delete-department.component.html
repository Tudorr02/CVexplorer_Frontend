
<div class="h-full w-full flex flex-col">
<div class=" h-2/3 flex flex-col gap-3 px-4 justify-center">
    <p>Are you sure you want to delete the department <b>{{ departmentNode?.label }}</b>?</p>
</div>

<div class="h-1/3 flex justify-end items-center gap-3 ">
    @if(loading){
        <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '3vh', height: '3vh' }" />
    }
    <p-button label="Cancel" (click)="departmentDeleted.emit()" severity="secondary"></p-button>
    <p-button label="Delete" (click)="deleteDepartment()" severity="danger" [disabled]="loading"></p-button>
</div>

</div>
