<div class="content">
    <div class="field">
      <label for="departmentName" class="font-semibold w-24">Department Name</label>
      <input pInputText id="departmentName" [(ngModel)]="updatedDepartmentName" autocomplete="off" />
    </div>
  </div>

  <div class="dialog-actions">
    @if(loading){
        <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '3vh', height: '3vh' }" />
    }
    <p-button label="Rename" (click)="renameDepartment(updatedDepartmentName)" ></p-button>
    
</div>
